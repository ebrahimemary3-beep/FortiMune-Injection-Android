name: Build IVAS Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this APK as the public download (GitHub Release)'
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Add the four Android signing secrets first.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fortimune.jks"
          chmod 600 "$RUNNER_TEMP/fortimune.jks"
      - name: Build signed release APK
        env:
          FORTIMUNE_KEYSTORE_FILE: ${{ runner.temp }}/fortimune.jks
          FORTIMUNE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FORTIMUNE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FORTIMUNE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p release
          VERSION=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk "release/IVAS-App-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk release/IVAS-App.apk
          # Old file name kept so links already shared keep working.
          cp app/build/outputs/apk/release/app-release.apk release/FortiMune-Injection.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IVAS-App
          path: release/*.apk
          if-no-files-found: error
      - name: Publish public download (GitHub Release)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          TAG="v$VERSION"
          NOTES="IVAS $VERSION — Innoval Vaccine Application System. Download IVAS-App.apk and install."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/IVAS-App.apk "release/IVAS-App-v$VERSION.apk" release/FortiMune-Injection.apk --clobber
          else
            gh release create "$TAG" release/IVAS-App.apk "release/IVAS-App-v$VERSION.apk" release/FortiMune-Injection.apk --title "IVAS $VERSION" --notes "$NOTES" --latest
          fi
      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fortimune.jks"
