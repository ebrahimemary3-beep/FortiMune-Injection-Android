name: Build FortiMune Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Download project files
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Show project structure
      - name: Check project
        run: |
          echo "===== PROJECT STRUCTURE ====="
          find . -maxdepth 3 -type f | sort

      # 5. Build DEBUG APK
      # Debug APK is automatically signed by Android Gradle Plugin
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      # 6. Find generated APK
      - name: Locate APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find . -type f -name "*.apk" -print

      # 7. Copy APK to a fixed name
      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" release/FortiMune-Injection-v1.1.0-debug.apk

          echo "===== FINAL APK ====="
          ls -lh release/

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FortiMune-Injection-v1.1.0
          path: release/FortiMune-Injection-v1.1.0-debug.apk
          if-no-files-found: error
